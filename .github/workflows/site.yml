name: Poke-Switch site checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "README.md"
      - "tests/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run site smoke tests
        run: node --test tests/site.test.cjs
