name: Poke-Switch site checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "run-local.bat"
      - "assets/css/styles.css"
      - "assets/js/app.js"
      - "data/catalogue.js"
      - "data/regions.js"
      - "README.md"
      - "tests/**"
      - ".github/workflows/site.yml"
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Check catalogue data syntax
        run: node --check data/catalogue.js
      - name: Check region data syntax
        run: node --check data/regions.js
      - name: Run site smoke tests
        run: node --test tests/site.test.cjs
